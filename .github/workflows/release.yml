name: Release

# Releases are cut two ways, and both end in the same place.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# or run this workflow by hand with a version, which creates the tag from inside
# CI rather than requiring a tag push. The second exists because pushing a tag is
# not always available: some environments can update branches and nothing else.
#
# Either way the version is written in exactly one place, and build.yml stays the
# per-push check.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with or without the leading v (0.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Both triggers carry the version somewhere different, so it is read once here
  # and every other job takes it from these outputs. Doing it per job is how the
  # two paths drift apart.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve
        id: resolve
        # The input goes through the environment rather than straight into the
        # script. A ${{ }} expansion is pasted in as text before bash sees the
        # line, so a value with a quote in it would run as code.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # This becomes a git tag, three zip file names and a shell argument, so
          # it has to be a version and nothing else.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a version number: '$VERSION'" >&2
            exit 1
          fi

          echo "Releasing $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            targetPlatform: StandaloneWindows64
            suffix: win64
          - name: MacOS
            targetPlatform: StandaloneOSX
            suffix: macos64
          - name: Linux
            targetPlatform: StandaloneLinux64
            suffix: lin64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: UnityBuilderAction.BuildScript.Build
          buildName: Soulbound-${{ matrix.suffix }}
          versioning: Custom
          version: ${{ needs.version.outputs.version }}

      # Assemble what a player needs to run the game: the player build, the engine
      # defaults it falls back to, and the mods folder that holds the game itself.
      # The documentation is deliberately not here. It is engine API reference for
      # people writing bosses, it is readable in the repository, and a player who
      # downloaded a game does not need 444 KB of it. build.yml still carries it,
      # because its artifacts are for the people who do.
      - name: Assemble the build
        run: |
          set -eu
          OUT="${{ github.workspace }}/build/${{ matrix.targetPlatform }}"
          sudo mkdir -v "$OUT/Default" "$OUT/Mods"
          sudo cp -Rv "${{ github.workspace }}/Assets/Default/" "$OUT/"
          sudo cp -Rv "${{ github.workspace }}/Assets/Mods/" "$OUT/"
          sudo find "$OUT" -name "*.meta" -type f -delete

      # This is the only thing that reaches a player before they run the game, so it is
      # where the "extract the archive first" warning has to live. Running the program
      # from inside the zip is the one failure the engine cannot recover from.
      - name: Add the read me
        run: sudo cp "${{ github.workspace }}/Read me first.txt" "${{ github.workspace }}/build/${{ matrix.targetPlatform }}/"

      - name: Add the Mac instructions
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: sudo cp "${{ github.workspace }}/How to run Soulbound on Mac.txt" "${{ github.workspace }}/build/${{ matrix.targetPlatform }}/"

      - name: Zip the build
        run: |
          set -eu
          cd "${{ github.workspace }}/build"
          sudo mv "${{ matrix.targetPlatform }}" "Soulbound-${{ needs.version.outputs.version }}-${{ matrix.suffix }}"
          sudo zip -qr "Soulbound-${{ needs.version.outputs.version }}-${{ matrix.suffix }}.zip" \
            "Soulbound-${{ needs.version.outputs.version }}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Soulbound-${{ matrix.suffix }}
          path: build/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the platform builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Published so anyone passing a build around can check they got the real one.
      # The paths are stripped so the file reads as three lines of "hash  filename",
      # which is what sha256sum -c expects next to the downloaded zips.
      - name: Checksum the archives
        run: |
          set -eu
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The changelog is the source for release notes. Pull out the section for
      # this version; fall back to a pointer if there is no matching heading.
      - name: Extract the release notes
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python3 - "$VERSION" <<'PY' > notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # match "## 0.3" or "## 0.3.0", with or without a trailing date
          pattern = re.compile(
              r"^## %s(?:\.0)?\b.*?$(.*?)(?=^## |\Z)" % re.escape(version.rsplit(".", 1)[0]),
              re.M | re.S)
          m = pattern.search(text)
          print(m.group(1).strip() if m else
                "See [CHANGELOG.md](CHANGELOG.md) for what changed in this version.")
          PY

      # GitHub excludes pre-releases from "latest", and the repository sidebar shows
      # the latest release, so a pre-release does not appear there at all. Everything
      # up to v1.0 is a development build, and marking them all pre-release would mean
      # an empty sidebar for the whole of 0.4 through 0.9. The 0.x version number and
      # the warning at the top of the notes are the honest signals; the flag is kept
      # for the case it was meant for, a candidate that should not be the headline.
      #
      # This step runs under bash, which GitHub uses by default on ubuntu-latest, so
      # [[ ]] is available. --latest needs gh 2.28 or newer; runners are well past it.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eu
          # A plain version is a real release. One carrying a semver pre-release
          # identifier, 0.9.0-rc1, is not.
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi
          echo "Publishing $TAG with $RELEASE_FLAG at $GITHUB_SHA"

          # --target creates the tag when it does not exist yet, which is the
          # manual path. On a tag push the tag is already there and points at this
          # same commit, so passing it changes nothing.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Soulbound $TAG" \
            --notes-file notes.md \
            "$RELEASE_FLAG" \
            dist/*.zip dist/SHA256SUMS.txt
